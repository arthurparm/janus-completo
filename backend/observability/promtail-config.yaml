server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: janus-logs
    pipeline_stages:
      - replace:
          expression: '(?i)(bearer\s+)[a-z0-9._~-]+'
          replace: '${1}[REDACTED_SECRET]'
      - replace:
          expression: '(?i)\b(sk-|gh[pousr]_|xox[baprs]-)[a-z0-9_-]{12,}\b'
          replace: '[REDACTED_SECRET]'
      - replace:
          expression: '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
          replace: '[REDACTED_PII]'
      - replace:
          expression: '\b(\d[ -]*?){13,19}\b'
          replace: '[REDACTED_PAYMENT]'
      - replace:
          expression: '\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b'
          replace: '[REDACTED_PII]'
    static_configs:
      - targets:
          - localhost
        labels:
          job: janus
          app: janus-api
          __path__: /var/log/backend/*.log
