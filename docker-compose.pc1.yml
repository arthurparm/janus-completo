version: '3.9'

services:
  janus-api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        JANUS_BUILD_REF: ${JANUS_BUILD_REF:-local-dev}
        JANUS_BUILD_DATE: ${JANUS_BUILD_DATE:-}
        JANUS_VERSION: ${JANUS_VERSION:-0.5.44}
      target: final
    image: ${REGISTRY:-docker.io}/${NAMESPACE:-arthurparaiso}/janus-api:${VERSION:-0.5.44}
    container_name: janus_api_pc1
    platform: linux/amd64
    init: true
    ports:
      - "8000:8000"
    env_file:
      - .env.pc1
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JANUS_API_PROFILE=user
      - JANUS_BUILD_REF=${JANUS_BUILD_REF:-local-dev}
      - AUDIT_LEDGER_HMAC_KEY=${AUDIT_LEDGER_HMAC_KEY:?Set AUDIT_LEDGER_HMAC_KEY in .env.pc1}
      - OIDC_ISSUER=${OIDC_ISSUER:?Set OIDC_ISSUER in .env.pc1}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?Set OIDC_JWKS_URL in .env.pc1}
      - OIDC_AUTHORIZATION_ENDPOINT=${OIDC_AUTHORIZATION_ENDPOINT:?Set OIDC_AUTHORIZATION_ENDPOINT in .env.pc1}
      - OIDC_PUBLIC_CLIENT_ID=${OIDC_PUBLIC_CLIENT_ID:?Set OIDC_PUBLIC_CLIENT_ID in .env.pc1}
      - OIDC_USER_AUDIENCE=${OIDC_USER_AUDIENCE:-janus-user-api}
      - OIDC_SERVICE_ISSUER=${OIDC_SERVICE_ISSUER:?Set OIDC_SERVICE_ISSUER in .env.pc1}
      - OIDC_SERVICE_JWKS_URL=${OIDC_SERVICE_JWKS_URL:?Set OIDC_SERVICE_JWKS_URL in .env.pc1}
      - OIDC_SERVICE_AUDIENCE=${OIDC_SERVICE_AUDIENCE:-janus-control-plane}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:?Set OIDC_ADMIN_GROUP in .env.pc1}
      - OIDC_SERVICE_TOKEN_URL=${OIDC_SERVICE_TOKEN_URL:?Set OIDC_SERVICE_TOKEN_URL in .env.pc1}
      - ADMIN_FACADE_CLIENT_ID=${ADMIN_FACADE_CLIENT_ID:-janus-admin-facade}
      - ADMIN_FACADE_CLIENT_SECRET=${ADMIN_FACADE_CLIENT_SECRET:?Set ADMIN_FACADE_CLIENT_SECRET in .env.pc1}
      - CONTROL_PLANE_BASE_URL=http://janus-control-plane:8000
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-["http://localhost:4300","http://127.0.0.1:4300"]}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-janus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.pc1}
      - POSTGRES_DB=${POSTGRES_DB:-janus_db}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT:-15672}
      - RABBITMQ_USER=${RABBITMQ_USER:-janus}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.pc1}
      - NEO4J_URI=${NEO4J_URI:?Set NEO4J_URI in .env.pc1 (bolt://<PC2_TAILSCALE_IP>:7687)}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.pc1}
      - QDRANT_HOST=${QDRANT_HOST:?Set QDRANT_HOST in .env.pc1 (<PC2_TAILSCALE_IP>)}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_HTTPS=${QDRANT_HTTPS:-false}
      - QDRANT_TLS_CA_CERT=${QDRANT_TLS_CA_CERT:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env.pc1}
      - OLLAMA_HOST=${OLLAMA_HOST:?Set OLLAMA_HOST in .env.pc1 (http://<PC2_TAILSCALE_IP>:11434)}
      - OLLAMA_ORCHESTRATOR_MODEL=${OLLAMA_ORCHESTRATOR_MODEL:-gpt-oss:20b}
      - OLLAMA_CODER_MODEL=${OLLAMA_CODER_MODEL:-qwen3.5:9b}
      - OLLAMA_CURATOR_MODEL=${OLLAMA_CURATOR_MODEL:-ministral-3:14b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen3.5:9b}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-120m}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - CHAT_UNLIMITED_USERS=${CHAT_UNLIMITED_USERS:-}
      - TOOL_EGRESS_ALLOW_HOSTS=${TOOL_EGRESS_ALLOW_HOSTS:-}
      - WORKER_EGRESS_ALLOW_HOSTS=${WORKER_EGRESS_ALLOW_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-5.6-luna}
      - OPENAI_MODELS=${OPENAI_MODELS:-["gpt-5.6-luna"]}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-3.6-flash}
      - GEMINI_MODELS=${GEMINI_MODELS:-["gemini-3.6-flash"]}
      - DEEPSEEK_MODEL_NAME=${DEEPSEEK_MODEL_NAME:-deepseek-v4-flash}
      - DEEPSEEK_MODELS=${DEEPSEEK_MODELS:-["deepseek-v4-flash","deepseek-v4-pro"]}
      - XAI_MODEL_NAME=${XAI_MODEL_NAME:-grok-4.5}
      - XAI_MODELS=${XAI_MODELS:-["grok-4.5"]}
      - OPENROUTER_FREE_MODELS_ENABLED=${OPENROUTER_FREE_MODELS_ENABLED:-false}
      - OPENROUTER_REASONING_ENABLED=${OPENROUTER_REASONING_ENABLED:-true}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - OPENROUTER_MODELS=${OPENROUTER_MODELS:-["nvidia/nemotron-3-ultra-550b-a55b:free","poolside/laguna-s-2.1:free","cohere/north-mini-code:free","google/gemma-4-31b-it:free","openai/gpt-oss-20b:free"]}
      - START_ORCHESTRATOR_WORKERS_ON_STARTUP=${START_ORCHESTRATOR_WORKERS_ON_STARTUP:-true}
      - AUTO_INDEX_ON_STARTUP=${AUTO_INDEX_ON_STARTUP:-true}
      - INIT_MAS_AGENTS_ON_STARTUP=${INIT_MAS_AGENTS_ON_STARTUP:-false}
      - AUTONOMY_SELF_STUDY_MAX_RUN_SECONDS=${AUTONOMY_SELF_STUDY_MAX_RUN_SECONDS:-600}
      - AUTONOMY_SELF_STUDY_RUN_DEADLINE_LOCAL=${AUTONOMY_SELF_STUDY_RUN_DEADLINE_LOCAL:-}
      - AUTONOMY_SELF_STUDY_LOCAL_ONLY=${AUTONOMY_SELF_STUDY_LOCAL_ONLY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      - ./.secrets/qdrant:/run/secrets/janus/qdrant:ro
      - janus_app_data:/app/data
      - janus_workspace:/app/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 4g
    cpus: "4.0"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/healthz/user)\" = 401"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 50s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - janus-pc1-net

  janus-public-api:
    image: ${REGISTRY:-docker.io}/${NAMESPACE:-arthurparaiso}/janus-api:${VERSION:-0.5.44}
    container_name: janus_public_api_pc1
    platform: linux/amd64
    init: true
    ports:
      - "${PUBLIC_API_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JANUS_API_PROFILE=public
      - OIDC_ISSUER=${OIDC_ISSUER:?Set OIDC_ISSUER in .env.pc1}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:?Set OIDC_JWKS_URL in .env.pc1}
      - OIDC_AUTHORIZATION_ENDPOINT=${OIDC_AUTHORIZATION_ENDPOINT:?Set OIDC_AUTHORIZATION_ENDPOINT in .env.pc1}
      - OIDC_PUBLIC_CLIENT_ID=${OIDC_PUBLIC_CLIENT_ID:?Set OIDC_PUBLIC_CLIENT_ID in .env.pc1}
      - OIDC_USER_AUDIENCE=${OIDC_USER_AUDIENCE:-janus-user-api}
      - OIDC_SERVICE_ISSUER=${OIDC_SERVICE_ISSUER:?Set OIDC_SERVICE_ISSUER in .env.pc1}
      - OIDC_SERVICE_JWKS_URL=${OIDC_SERVICE_JWKS_URL:?Set OIDC_SERVICE_JWKS_URL in .env.pc1}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:?Set OIDC_ADMIN_GROUP in .env.pc1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/public"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - janus-pc1-net

  janus-control-plane:
    image: ${REGISTRY:-docker.io}/${NAMESPACE:-arthurparaiso}/janus-api:${VERSION:-0.5.44}
    container_name: janus_control_plane_pc1
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8002}:8000"
    env_file:
      - .env.pc1
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JANUS_API_PROFILE=control-plane
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:?Set OIDC_ADMIN_GROUP in .env.pc1}
      - CONTROL_PLANE_BASE_URL=http://janus-control-plane:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      - ./.secrets/qdrant:/run/secrets/janus/qdrant:ro
      - ./.secrets/internal:/run/secrets/janus/internal:ro
      - janus_app_data:/app/data
      - janus_workspace:/app/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/healthz/control-plane)\" = 401"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 50s
    networks:
      - janus-pc1-net

  janus-frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        JANUS_BUILD_REF: ${JANUS_BUILD_REF:-local-dev}
        JANUS_BUILD_DATE: ${JANUS_BUILD_DATE:-}
        JANUS_VERSION: ${JANUS_VERSION:-0.5.44}
    image: ${REGISTRY:-docker.io}/${NAMESPACE:-arthurparaiso}/janus-frontend:${VERSION:-0.5.44}
    container_name: janus_frontend_pc1
    platform: linux/amd64
    ports:
      - "${FRONTEND_PORT:-4300}:4300"
    depends_on:
      janus-api:
        condition: service_healthy
      janus-public-api:
        condition: service_healthy
    environment:
      - JANUS_API_URL=${JANUS_API_URL:-http://janus-api:8000}
      - PORT=4300
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4300/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - janus-pc1-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: janus_postgres_pc1
    platform: linux/amd64
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-janus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.pc1}
      - POSTGRES_DB=${POSTGRES_DB:-janus_db}
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS:--c shared_buffers=256MB -c effective_cache_size=1GB}
    volumes:
      - janus_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - janus-pc1-net

  redis:
    image: redis:7-alpine
    container_name: janus_redis_pc1
    platform: linux/amd64
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - janus_redis_data:/data
    restart: unless-stopped
    mem_limit: 384m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - janus-pc1-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: janus_rabbitmq_pc1
    platform: linux/amd64
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-janus}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.pc1}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - janus_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - janus-pc1-net

networks:
  janus-pc1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  janus_postgres_data:
  janus_redis_data:
  janus_rabbitmq_data:
  janus_app_data:
  janus_workspace:
