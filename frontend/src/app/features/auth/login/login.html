<section class="login">
  <div class="glass-panel">
    <div class="panel-glow" aria-hidden="true"></div>
    <div class="brand">
      <div class="signal-orb" aria-hidden="true">
        <span class="signal-core"></span>
        <span class="signal-ring"></span>
        <span class="signal-ring ring-two"></span>
      </div>
      <p class="eyebrow">JANUS // OIDC</p>
      <h1>VERIFICAÇÃO DE ACESSO</h1>
      <p class="sub">A autenticação é concluída no provedor de identidade da organização.</p>
      <div class="status-chip"><span class="status-dot"></span>AUTHORIZATION CODE + PKCE</div>
    </div>

    <button type="button" class="glass-button primary" (click)="beginLogin()" [disabled]="loading">
      <span>{{ loading ? 'REDIRECIONANDO…' : 'ENTRAR COM O PROVEDOR DE IDENTIDADE' }}</span>
      @if (!loading) { <span class="material-icons">login</span> }
    </button>

    @if (error) {
      <div class="error-box" role="alert" aria-live="assertive">{{ error }}</div>
    }
    @if (notice) {
      <div class="notice-box" role="status" aria-live="polite">{{ notice }}</div>
    }
  </div>
</section>
