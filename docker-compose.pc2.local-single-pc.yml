services:
  neo4j:
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "3.0"

  qdrant:
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"

  ollama:
    profiles: ["local-models"]
    mem_limit: 8g
    memswap_limit: 8g
    cpus: "6.0"
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "32"
      OLLAMA_DEFAULT_CTX: "4096"

  ollama-model-init:
    profiles: ["local-models"]
    mem_limit: 256m
    cpus: "0.5"
