# PC2 Hardware Configuration
# i9-13900F (24 cores: 8P + 16E), 64GB DDR5-5600, RTX 4060 Ti 16GB

version: '3.9'

services:
  neo4j:
    image: neo4j:5.19-community
    container_name: janus_neo4j_pc2
    platform: linux/amd64
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Auth
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.pc2}
      - NEO4J_PLUGINS=["apoc"]
      
      # Memory Configuration
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512M}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-2G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512M}
      
    volumes:
      - janus_neo4j_data:/data
      - janus_neo4j_logs:/logs
    restart: unless-stopped
    
    # CPU & Memory: 10 cores (P-cores for consistency) + 20GB RAM
    # i9-13900F has 8 P-cores (3.0-5.6GHz) + 16 E-cores (2.5-4.3GHz)
    mem_limit: ${NEO4J_MEM_LIMIT:-4g}
    memswap_limit: ${NEO4J_MEMSWAP_LIMIT:-5g}
    cpus: "10.0"
    cpuset: "0-9"
    
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 30s
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    
    networks:
      - janus-pc2-net

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: janus_qdrant_pc2
    platform: linux/amd64
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      # Security
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env.pc2}
      - QDRANT__SERVICE__ENABLE_TLS=${QDRANT_ENABLE_TLS:-false}
      - QDRANT__TLS__CERT=${QDRANT_TLS_CERT:-/qdrant/tls/cert.pem}
      - QDRANT__TLS__KEY=${QDRANT_TLS_KEY:-/qdrant/tls/key.pem}
      - QDRANT__TLS__CA_CERT=${QDRANT_TLS_CA_CERT:-/qdrant/tls/ca.pem}
      
      # Storage Configuration (SSD-optimized)
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
      - QDRANT__STORAGE__SNAPSHOTS_TEMP_PATH=/qdrant/temp
      - QDRANT__STORAGE__TEMP_PATH=/qdrant/temp
      
      # Performance Tuning
      - QDRANT__STORAGE__PREFER_MMAP=false
      - QDRANT__STORAGE__HNSW_USE_MEMMAP=false
      
      # Vector Search Parameters (GPU-friendly)
      - QDRANT__STORAGE__SNAPSHOTS_SNAPSHOT_TEMP_DIR=/tmp
      
      # Service Configuration
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      
      # Concurrency
      - QDRANT__SERVICE__READ_ONLY_MODE=false
    
    volumes:
      - janus_qdrant_data:/qdrant/storage
      - janus_qdrant_snapshots:/qdrant/snapshots
      - janus_qdrant_temp:/qdrant/temp
      - ./.secrets/qdrant:/qdrant/tls:ro
    
    restart: unless-stopped
    
    # CPU & Memory: 6 cores (E-cores) + 12GB RAM
    # Qdrant is CPU-bound for HNSW (approximate nearest neighbor)
    mem_limit: 12g
    memswap_limit: 14g
    cpus: "6.0"
    cpuset: "10-15"
    
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': >/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    
    networks:
      - janus-pc2-net

networks:
  janus-pc2-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  janus_neo4j_data:
    driver: local
  janus_neo4j_logs:
    driver: local
  janus_qdrant_data:
    driver: local
  janus_qdrant_snapshots:
    driver: local
  janus_qdrant_temp:
    driver: local
